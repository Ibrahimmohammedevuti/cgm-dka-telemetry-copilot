        // ============================================================================
        // 2. CLINICAL REASONING, DIVERGENCE, GV TREND & PDF BUILDER FUNCTIONS
        // ============================================================================
        function computeCgmCkmDivergence(series, maxGlucoseScale) {
          maxGlucoseScale = maxGlucoseScale || 350;
          const points = series.map(function (pt, idx) {
            const prev = idx > 0 ? series[idx - 1] : pt;
            const dt = idx > 0 ? Math.max(1, pt.hour - prev.hour) : 1;
            const deltaGlucoseMgDlHr = Number(
              ((pt.glucoseMgDl - prev.glucoseMgDl) / dt).toFixed(1)
            );
            const deltaKetoneMmolHr = Number(
              ((pt.ketoneMmolL - prev.ketoneMmolL) / dt).toFixed(2)
            );

            const isEuDkaDivergence =
              (pt.ketoneMmolL >= 1.5 && pt.glucoseMgDl < 220) ||
              (deltaKetoneMmolHr >= 0.18 && pt.glucoseMgDl < 200);
            const isHhsDivergence = pt.glucoseMgDl >= 520 && pt.ketoneMmolL < 1.0;
            const isSomogyiDivergence =
              pt.glucoseMgDl < 70 ||
              (Math.abs(deltaGlucoseMgDlHr) >= 40 && pt.ketoneMmolL >= 0.45);
            const isHighRiskDivergence =
              isEuDkaDivergence || isHhsDivergence || isSomogyiDivergence;

            const glycemicDeviation =
              pt.glucoseMgDl < 70
                ? (70 - pt.glucoseMgDl) / 40
                : pt.glucoseMgDl > 180
                  ? (pt.glucoseMgDl - 180) / Math.max(200, maxGlucoseScale - 180)
                  : 0;
            const ketoneDeviation = Math.max(0, (pt.ketoneMmolL - 0.4) / 4.0);

            const decouplingSpread = Math.abs(ketoneDeviation - glycemicDeviation) * 85;
            const velocityBoost = Math.min(
              30,
              Math.max(0, deltaKetoneMmolHr - 0.05) * 90 +
                Math.max(0, Math.abs(deltaGlucoseMgDlHr) - 25) * 0.5
            );
            const clinicalDecouplingBonus = isEuDkaDivergence
              ? 22 + (pt.ketoneMmolL / 4.0) * 18
              : isHhsDivergence
                ? 25
                : isSomogyiDivergence
                  ? 24
                  : 0;
            const divergenceIndex = Number(
              Math.min(100, decouplingSpread + velocityBoost + clinicalDecouplingBonus).toFixed(1)
            );

            let riskZone = 'NOMINAL';
            if (
              isHighRiskDivergence ||
              pt.ketoneMmolL >= 3.0 ||
              pt.glucoseMgDl < 54 ||
              pt.glucoseMgDl >= 520
            ) {
              riskZone = 'CRITICAL_DIVERGENCE';
            } else if (
              pt.ketoneMmolL >= 0.8 ||
              pt.glucoseMgDl < 70 ||
              pt.glucoseMgDl > 180 ||
              divergenceIndex >= 28
            ) {
              riskZone = 'ELEVATED_WATCH';
            }

            let divergenceReason;
            if (isEuDkaDivergence) {
              divergenceReason =
                'EuDKA Decoupling: Ketones ' +
                pt.ketoneMmolL.toFixed(2) +
                ' mmol/L (Δ+' +
                deltaKetoneMmolHr.toFixed(2) +
                '/hr) vs euglycemic CGM ' +
                pt.glucoseMgDl +
                ' mg/dL';
            } else if (isHhsDivergence) {
              divergenceReason =
                'Hyperosmolar Decoupling: Extreme CGM ' +
                pt.glucoseMgDl +
                ' mg/dL with suppressed CKM ' +
                pt.ketoneMmolL.toFixed(2) +
                ' mmol/L';
            } else if (isSomogyiDivergence) {
              divergenceReason =
                pt.glucoseMgDl < 70
                  ? 'Nocturnal Neuroglycopenia (' +
                    pt.glucoseMgDl +
                    ' mg/dL) triggering counter-regulatory ketogenesis'
                  : 'Rapid Somogyi Rebound (Δ' +
                    (deltaGlucoseMgDlHr > 0 ? '+' : '') +
                    deltaGlucoseMgDlHr +
                    ' mg/dL/hr) with lag ketonemia';
            }

            return {
              hour: pt.hour,
              timeLabel: pt.timeLabel,
              glucoseMgDl: pt.glucoseMgDl,
              ketoneMmolL: pt.ketoneMmolL,
              deltaGlucoseMgDlHr: deltaGlucoseMgDlHr,
              deltaKetoneMmolHr: deltaKetoneMmolHr,
              divergenceIndex: divergenceIndex,
              isHighRiskDivergence: isHighRiskDivergence,
              riskZone: riskZone,
              divergenceReason: divergenceReason
            };
          });

          const highRiskWindows = [];
          let currentStart = null;
          let currentPeak = 0;
          let currentMechanism = '';

          points.forEach(function (pt, idx) {
            if (pt.isHighRiskDivergence) {
              if (!currentStart) {
                currentStart = pt;
                currentPeak = pt.divergenceIndex;
                currentMechanism = pt.divergenceReason || 'High-Risk CGM/CKM Divergence';
              } else if (pt.divergenceIndex > currentPeak) {
                currentPeak = pt.divergenceIndex;
                currentMechanism = pt.divergenceReason || currentMechanism;
              }
            }
            const isLast = idx === points.length - 1;
            if ((!pt.isHighRiskDivergence || isLast) && currentStart) {
              const endPt = pt.isHighRiskDivergence ? pt : points[idx - 1];
              highRiskWindows.push({
                startHour: currentStart.hour,
                endHour: endPt.hour,
                startLabel: currentStart.timeLabel,
                endLabel: endPt.timeLabel,
                peakDivergenceIndex: currentPeak,
                mechanismLabel: currentMechanism
              });
              currentStart = null;
              currentPeak = 0;
            }
          });

          const totalHighRiskHours = points.filter(function (p) {
            return p.isHighRiskDivergence;
          }).length;
          const criticalZoneHours = points.filter(function (p) {
            return p.riskZone === 'CRITICAL_DIVERGENCE';
          }).length;
          const elevatedWatchHours = points.filter(function (p) {
            return p.riskZone === 'ELEVATED_WATCH';
          }).length;
          const nominalHours = points.filter(function (p) {
            return p.riskZone === 'NOMINAL';
          }).length;
          const peakDivergenceIndex = Number(
            Math.max.apply(
              null,
              [0].concat(
                points.map(function (p) {
                  return p.divergenceIndex;
                })
              )
            ).toFixed(1)
          );

          const dominantMechanism =
            (highRiskWindows[0] && highRiskWindows[0].mechanismLabel) ||
            'Physiological Concordance (CGM & CKM homeostatically coupled)';

          return {
            points: points,
            highRiskWindows: highRiskWindows,
            totalHighRiskHours: totalHighRiskHours,
            criticalZoneHours: criticalZoneHours,
            elevatedWatchHours: elevatedWatchHours,
            nominalHours: nominalHours,
            peakDivergenceIndex: peakDivergenceIndex,
            dominantMechanism: dominantMechanism
          };
        }

        function computeGlycemicVariabilityTrend(series) {
          const glucoses = series.map(function (p) {
            return p.glucoseMgDl;
          });
          const meanGlucoseMgDl = Number(
            (
              glucoses.reduce(function (a, b) {
                return a + b;
              }, 0) / glucoses.length
            ).toFixed(1)
          );
          const variance =
            glucoses.reduce(function (acc, v) {
              return acc + Math.pow(v - meanGlucoseMgDl, 2);
            }, 0) / glucoses.length;
          const standardDeviationMgDl = Number(Math.sqrt(variance).toFixed(1));
          const overallCvPercent = Number(
            ((standardDeviationMgDl / meanGlucoseMgDl) * 100).toFixed(1)
          );
          const glycemicAmplitudeMgDl =
            Math.max.apply(null, glucoses) - Math.min.apply(null, glucoses);
          const adaTargetThresholdPercent = 36.0;
          const isStableVariability = overallCvPercent <= adaTargetThresholdPercent;

          const quadrantDefs = [
            { id: 'nocturnal', label: 'Nocturnal Window', hourRangeLabel: '00:00–06:00', startHr: 0, endHr: 6 },
            { id: 'morning', label: 'Morning Window', hourRangeLabel: '06:00–12:00', startHr: 6, endHr: 12 },
            { id: 'afternoon', label: 'Afternoon Window', hourRangeLabel: '12:00–18:00', startHr: 12, endHr: 18 },
            { id: 'evening', label: 'Evening Window', hourRangeLabel: '18:00–24:00', startHr: 18, endHr: 24 }
          ];

          const quadrants = quadrantDefs.map(function (q) {
            const pts = series.filter(function (p) {
              return p.hour >= q.startHr && p.hour <= q.endHr;
            });
            const vals = pts.map(function (p) {
              return p.glucoseMgDl;
            });
            const qMean =
              vals.reduce(function (a, b) {
                return a + b;
              }, 0) / vals.length;
            const qVar =
              vals.reduce(function (a, b) {
                return a + Math.pow(b - qMean, 2);
              }, 0) / vals.length;
            const qSd = Math.sqrt(qVar);
            const qCv = Number(((qSd / qMean) * 100).toFixed(1));
            const minV = Math.min.apply(null, vals);
            const maxV = Math.max.apply(null, vals);
            return {
              id: q.id,
              label: q.label,
              hourRangeLabel: q.hourRangeLabel,
              meanMgDl: Number(qMean.toFixed(1)),
              sdMgDl: Number(qSd.toFixed(1)),
              cvPercent: qCv,
              minMgDl: minV,
              maxMgDl: maxV,
              isHighVariability: qCv > 25.0 || maxV - minV >= 90
            };
          });

          const maxKetone = Math.max.apply(
            null,
            series.map(function (p) {
              return p.ketoneMmolL;
            })
          );
          let clinicalInterpretation = '';
          if (!isStableVariability) {
            clinicalInterpretation =
              'High 24h Glycemic Variability (CV ' +
              overallCvPercent +
              '% > 36% ADA threshold; amplitude ' +
              glycemicAmplitudeMgDl +
              ' mg/dL) indicates labile counter-regulatory swings and elevated hypoglycemia/rebound risk.';
          } else if (maxKetone >= 3.0) {
            clinicalInterpretation =
              'Deceptive Glycemic Stability Trap: 24h CGM CV is low (' +
              overallCvPercent +
              '% <= 36% threshold), but SGLT2i glycosuria is clamping glucose variance while interstitial ketones surge to ' +
              maxKetone.toFixed(2) +
              ' mmol/L.';
          } else {
            clinicalInterpretation =
              'Glycemic Variability is within the international consensus target (CV ' +
              overallCvPercent +
              '% <= 36.0%; SD ' +
              standardDeviationMgDl +
              ' mg/dL), reflecting stable glycemic modulation.';
          }

          return {
            overallCvPercent: overallCvPercent,
            standardDeviationMgDl: standardDeviationMgDl,
            meanGlucoseMgDl: meanGlucoseMgDl,
            glycemicAmplitudeMgDl: glycemicAmplitudeMgDl,
            adaTargetThresholdPercent: adaTargetThresholdPercent,
            isStableVariability: isStableVariability,
            stabilityClassification: isStableVariability
              ? 'STABLE GV (CV <= 36%)'
              : 'LABILE / HIGH GV (CV > 36%)',
            clinicalInterpretation: clinicalInterpretation,
            quadrants: quadrants
          };
        }

        function computeTelemetryAnalytics(series, context, overrides) {
          overrides = overrides || {};
          const modifiedSeries = series.map(function (pt, idx) {
            if (idx === series.length - 1) {
              return {
                hour: pt.hour,
                timeLabel: pt.timeLabel,
                glucoseMgDl:
                  overrides.overrideLatestGlucoseMgDl !== undefined
                    ? overrides.overrideLatestGlucoseMgDl
                    : pt.glucoseMgDl,
                ketoneMmolL:
                  overrides.overrideLatestKetoneMmolL !== undefined
                    ? overrides.overrideLatestKetoneMmolL
                    : pt.ketoneMmolL,
                eventAnnotation: pt.eventAnnotation
              };
            }
            return pt;
          });

          const glucoses = modifiedSeries.map(function (p) {
            return p.glucoseMgDl;
          });
          const ketones = modifiedSeries.map(function (p) {
            return p.ketoneMmolL;
          });

          const latestGlucoseMgDl = glucoses[glucoses.length - 1];
          const meanGlucoseMgDl = Number(
            (
              glucoses.reduce(function (a, b) {
                return a + b;
              }, 0) / glucoses.length
            ).toFixed(1)
          );
          const minGlucoseMgDl = Math.min.apply(null, glucoses);
          const maxGlucoseMgDl = Math.max.apply(null, glucoses);

          const nocturnalPoints = modifiedSeries.filter(function (p) {
            return p.hour >= 0 && p.hour <= 6;
          });
          let nocturnalNadirMgDl = nocturnalPoints[0]
            ? nocturnalPoints[0].glucoseMgDl
            : minGlucoseMgDl;
          let nocturnalNadirHour = nocturnalPoints[0] ? nocturnalPoints[0].hour : 0;
          nocturnalPoints.forEach(function (pt) {
            if (pt.glucoseMgDl < nocturnalNadirMgDl) {
              nocturnalNadirMgDl = pt.glucoseMgDl;
              nocturnalNadirHour = pt.hour;
            }
          });

          const morningPoints = modifiedSeries.filter(function (p) {
            return p.hour >= 6 && p.hour <= 10;
          });
          const morningPeakMgDl = Math.max.apply(
            null,
            morningPoints.map(function (p) {
              return p.glucoseMgDl;
            })
          );

          const variance =
            glucoses.reduce(function (acc, val) {
              return acc + Math.pow(val - meanGlucoseMgDl, 2);
            }, 0) / glucoses.length;
          const sd = Math.sqrt(variance);
          const glucoseCvPercent = Number(((sd / meanGlucoseMgDl) * 100).toFixed(1));

          const inRangeCount = glucoses.filter(function (g) {
            return g >= 70 && g <= 180;
          }).length;
          const belowRangeCount = glucoses.filter(function (g) {
            return g < 70;
          }).length;
          const timeInRangePercent = Math.round((inRangeCount / glucoses.length) * 100);
          const timeBelowRangePercent = Math.round((belowRangeCount / glucoses.length) * 100);
          const timeAboveRangePercent = Math.max(
            0,
            100 - timeInRangePercent - timeBelowRangePercent
          );

          const latestKetoneMmolL = Number(ketones[ketones.length - 1].toFixed(2));
          const peakKetoneMmolL = Number(Math.max.apply(null, ketones).toFixed(2));

          let maxKetoneVelocityMmolHr = 0;
          for (let i = 1; i < modifiedSeries.length; i++) {
            const dt = modifiedSeries[i].hour - modifiedSeries[i - 1].hour || 1;
            const dK =
              (modifiedSeries[i].ketoneMmolL - modifiedSeries[i - 1].ketoneMmolL) / dt;
            if (dK > maxKetoneVelocityMmolHr) maxKetoneVelocityMmolHr = dK;
          }
          maxKetoneVelocityMmolHr = Number(maxKetoneVelocityMmolHr.toFixed(2));

          const lookbackIdx = Math.max(0, modifiedSeries.length - 7);
          const sixHourKetoneDelta = Number(
            (latestKetoneMmolL - modifiedSeries[lookbackIdx].ketoneMmolL).toFixed(2)
          );

          const sodium =
            overrides.overrideSodiumMeqL !== undefined
              ? overrides.overrideSodiumMeqL
              : context.sodiumMeqL;
          const bicarb =
            overrides.overrideBicarbonateMeqL !== undefined
              ? overrides.overrideBicarbonateMeqL
              : context.bicarbonateMeqL;
          const anionGapMeqL = Number((sodium - (context.chlorideMeqL + bicarb)).toFixed(1));
          const correctedSodiumMeqL = Number(
            (sodium + 0.016 * Math.max(0, latestGlucoseMgDl - 100)).toFixed(1)
          );
          const effectiveOsmolalityMosmKg = Number(
            (2 * sodium + latestGlucoseMgDl / 18).toFixed(1)
          );
          const totalOsmolalityMosmKg = Number(
            (effectiveOsmolalityMosmKg + context.bunMgDl / 2.8).toFixed(1)
          );

          return {
            latestGlucoseMgDl: latestGlucoseMgDl,
            meanGlucoseMgDl: meanGlucoseMgDl,
            minGlucoseMgDl: minGlucoseMgDl,
            maxGlucoseMgDl: maxGlucoseMgDl,
            nocturnalNadirMgDl: nocturnalNadirMgDl,
            nocturnalNadirHour: nocturnalNadirHour,
            morningPeakMgDl: morningPeakMgDl,
            glucoseCvPercent: glucoseCvPercent,
            timeInRangePercent: timeInRangePercent,
            timeBelowRangePercent: timeBelowRangePercent,
            timeAboveRangePercent: timeAboveRangePercent,
            latestKetoneMmolL: latestKetoneMmolL,
            peakKetoneMmolL: peakKetoneMmolL,
            maxKetoneVelocityMmolHr: maxKetoneVelocityMmolHr,
            sixHourKetoneDelta: sixHourKetoneDelta,
            anionGapMeqL: anionGapMeqL,
            correctedSodiumMeqL: correctedSodiumMeqL,
            effectiveOsmolalityMosmKg: effectiveOsmolalityMosmKg,
            totalOsmolalityMosmKg: totalOsmolalityMosmKg
          };
        }

        function evaluateClinicalReasoningPipeline(preset, overrides) {
          overrides = overrides || {};
          const effectiveContext = Object.assign({}, preset.patientContext, {
            sglt2InhibitorActive:
              overrides.sglt2InhibitorActive !== undefined
                ? overrides.sglt2InhibitorActive
                : preset.patientContext.sglt2InhibitorActive,
            bicarbonateMeqL:
              overrides.overrideBicarbonateMeqL !== undefined
                ? overrides.overrideBicarbonateMeqL
                : preset.patientContext.bicarbonateMeqL,
            venousPh:
              overrides.overrideVenousPh !== undefined
                ? overrides.overrideVenousPh
                : preset.patientContext.venousPh,
            sodiumMeqL:
              overrides.overrideSodiumMeqL !== undefined
                ? overrides.overrideSodiumMeqL
                : preset.patientContext.sodiumMeqL
          });

          const analytics = computeTelemetryAnalytics(
            preset.series,
            effectiveContext,
            overrides
          );

          const isKetonemiaCritical =
            analytics.latestKetoneMmolL >= 3.0 || analytics.peakKetoneMmolL >= 3.0;
          const isKetonemiaElevated = analytics.latestKetoneMmolL >= 1.5;
          const isAcidotic =
            effectiveContext.venousPh < 7.3 || effectiveContext.bicarbonateMeqL < 18;
          const isHighAnionGap = analytics.anionGapMeqL > 12;
          const isGlucoseEuglycemicRange = analytics.latestGlucoseMgDl < 250;
          const isSevereHyperosmolar =
            analytics.latestGlucoseMgDl >= 600 &&
            analytics.effectiveOsmolalityMosmKg >= 320 &&
            analytics.latestKetoneMmolL < 1.5;
          const isSomogyiPattern =
            analytics.nocturnalNadirMgDl < 70 &&
            analytics.morningPeakMgDl >= 200 &&
            analytics.latestKetoneMmolL < 1.5 &&
            !isAcidotic;

          let classificationCode = 'TIR_OPTIMAL';
          let classificationTitle =
            'Well-Controlled Glycemic & Ketone Homeostasis (ADA TIR Goal Met)';
          let urgency = 'ROUTINE_OPTIMIZATION';
          let urgencyLabel = 'Routine Outpatient Telemetry Continuation';
          let confidenceRationale = '';
          let immediateProtocolSteps = [];

          if (
            (isKetonemiaCritical || (isKetonemiaElevated && isAcidotic)) &&
            isGlucoseEuglycemicRange
          ) {
            classificationCode = 'EUGLYCEMIC_DKA';
            classificationTitle =
              'Euglycemic Diabetic Ketoacidosis (euDKA — SGLT2i / Starvation-Induced)';
            urgency = 'CRITICAL_ED_NOW';
            urgencyLabel = 'Critical Emergency: Immediate ED Resuscitation Required';
            confidenceRationale =
              'Interstitial BHB reached ' +
              analytics.latestKetoneMmolL.toFixed(2) +
              ' mmol/L (>= 3.0 mmol/L threshold) with Anion Gap ' +
              analytics.anionGapMeqL +
              ' mEq/L, HCO3- ' +
              effectiveContext.bicarbonateMeqL +
              ' mEq/L, and pH ' +
              effectiveContext.venousPh.toFixed(2) +
              ' despite deceptive glucose of ' +
              analytics.latestGlucoseMgDl +
              ' mg/dL (< 250 mg/dL).';
            immediateProtocolSteps = [
              'HOLD all SGLT2 inhibitors (Empagliflozin/Dapagliflozin/Canagliflozin) immediately; do not resume until acute illness and ketosis fully resolve.',
              'Initiate simultaneous IV Regular Insulin (0.1 units/kg/hr) AND Dextrose-containing IV fluids (D5W or D10W with 0.9%/0.45% NaCl) immediately because baseline blood glucose is < 250 mg/dL — insulin is mandatory to halt hormone-sensitive lipase ketogenesis, while dextrose prevents iatrogenic hypoglycemia.',
              'Verify serum potassium prior to insulin initiation (Current K+ ' +
                effectiveContext.potassiumMeqL.toFixed(1) +
                ' mEq/L; add 20–40 mEq KCl/L to IV fluids while K+ is 3.5–5.2 mEq/L and urine output is adequate).',
              'Monitor capillary/interstitial beta-hydroxybutyrate, venous blood gas, and electrolytes q2h until Anion Gap closes (<= 12 mEq/L) and BHB < 0.6 mmol/L.'
            ];
          } else if (isKetonemiaCritical && !isGlucoseEuglycemicRange) {
            classificationCode = 'CLASSIC_DKA';
            classificationTitle = 'Hyperglycemic Diabetic Ketoacidosis (Classic DKA)';
            urgency = 'CRITICAL_ED_NOW';
            urgencyLabel = 'Critical Emergency: Immediate ED DKA Protocol';
            confidenceRationale =
              'Hyperglycemia (' +
              analytics.latestGlucoseMgDl +
              ' mg/dL) coupled with severe ketonemia (' +
              analytics.latestKetoneMmolL.toFixed(2) +
              ' mmol/L), Anion Gap ' +
              analytics.anionGapMeqL +
              ' mEq/L, and metabolic acidosis (pH ' +
              effectiveContext.venousPh.toFixed(2) +
              ').';
            immediateProtocolSteps = [
              'Initiate isotonic crystalloid resuscitation (0.9% NaCl 15–20 mL/kg over first hour) to restore intravascular volume and renal perfusion.',
              'Start continuous IV Regular Insulin infusion at 0.1 units/kg/hr after confirming serum K+ >= 3.5 mEq/L.',
              'Add IV Dextrose (D5W) once serum glucose falls below 200–250 mg/dL while continuing insulin infusion until ketonemia (< 0.6 mmol/L) and anion gap acidosis resolve.',
              'Replete potassium (20–30 mEq/L IV fluids) and monitor venous pH, HCO3-, and BHB q2h.'
            ];
          } else if (isSevereHyperosmolar) {
            classificationCode = 'HHS_HYPEROSMOLAR';
            classificationTitle =
              'Hyperglycemic Hyperosmolar State (HHS — Non-Ketotic Hypertonicity)';
            urgency = 'CRITICAL_ED_NOW';
            urgencyLabel = 'Critical Emergency: Immediate ICU/ED Osmolar Resuscitation';
            confidenceRationale =
              'Severe hyperglycemia (' +
              analytics.latestGlucoseMgDl +
              ' mg/dL) and elevated effective serum osmolality (' +
              analytics.effectiveOsmolalityMosmKg +
              ' mOsm/kg > 320 mOsm/kg) without significant ketoacidosis (BHB ' +
              analytics.latestKetoneMmolL.toFixed(2) +
              ' mmol/L, pH ' +
              effectiveContext.venousPh.toFixed(2) +
              ', HCO3- ' +
              effectiveContext.bicarbonateMeqL +
              ' mEq/L).';
            immediateProtocolSteps = [
              'Prioritize aggressive IV crystalloid volume expansion (0.9% NaCl 1000–1500 mL in first hour) BEFORE initiating insulin; premature insulin shifts glucose intracellularly with water and can precipitate hypotensive vascular collapse.',
              'Calculate Corrected Sodium (' +
                analytics.correctedSodiumMeqL +
                ' mEq/L); transition to 0.45% NaCl after hemodynamic stabilization because corrected Na+ is normal/elevated.',
              'Target gradual osmolality reduction of 3–8 mOsm/kg/hr and glucose drop of 50–75 mg/dL/hr with low-dose IV insulin (0.05 units/kg/hr) after initial fluid load to prevent cerebral edema.',
              'Investigate and treat underlying infectious precipitant (e.g., pneumonia, UTI, sepsis) and provide venous thromboembolism prophylaxis.'
            ];
          } else if (isSomogyiPattern) {
            classificationCode = 'SOMOGYI_REBOUND';
            classificationTitle =
              'Nocturnal Hypoglycemia with Somogyi Counter-Regulatory Rebound';
            urgency = 'URGENT_CLINICAL_ACTION';
            urgencyLabel =
              'Urgent Regimen Adjustment: Prevent Recurrent Nocturnal Neuroglycopenia';
            confidenceRationale =
              'CGM trajectory reveals a Level 2 nocturnal nadir of ' +
              analytics.nocturnalNadirMgDl +
              ' mg/dL at 0' +
              analytics.nocturnalNadirHour +
              ':00 AM followed by a counter-regulatory morning surge to ' +
              analytics.morningPeakMgDl +
              ' mg/dL, with normal acid-base status (pH ' +
              effectiveContext.venousPh.toFixed(2) +
              ', BHB ' +
              analytics.latestKetoneMmolL.toFixed(2) +
              ' mmol/L).';
            immediateProtocolSteps = [
              'DO NOT increase evening basal insulin despite elevated fasting morning glucose — increasing basal insulin will deepen the 03:00 AM hypoglycemic nadir.',
              'Reduce evening basal insulin (Detemir/Glargine) dose by 15–20% (e.g., from 28U to 22–24U) or shift timing/formulation to ultra-long-acting degludec.',
              'Enable predictive low-glucose suspend (PLGS) or set nocturnal CGM low alert threshold at 80 mg/dL with audible wake alarm.',
              'Advise a 15g complex carbohydrate + protein bedtime snack if pre-bed glucose is < 120 mg/dL.'
            ];
          } else if (isKetonemiaElevated) {
            classificationCode = 'KETONEMIA_WARNING';
            classificationTitle =
              'Sub-Acute Ketonemia Escalation (Sick-Day Ketone Protocol Required)';
            urgency = 'URGENT_CLINICAL_ACTION';
            urgencyLabel = 'Urgent Ambulatory Sick-Day Intervention';
            confidenceRationale =
              'Interstitial ketones are elevated at ' +
              analytics.latestKetoneMmolL.toFixed(2) +
              ' mmol/L (1.5–2.9 mmol/L warning zone) with 6-hour delta of +' +
              analytics.sixHourKetoneDelta.toFixed(2) +
              ' mmol/L.';
            immediateProtocolSteps = [
              'Hold any SGLT2 inhibitor therapy immediately and initiate oral hydration (250–500 mL/hr water or electrolyte solution).',
              'Administer supplemental rapid-acting insulin correction (typically 10–15% of Total Daily Dose) alongside 15–30g oral carbohydrates if glucose is < 180 mg/dL.',
              'Recheck interstitial/capillary blood ketones every 2 hours; escalate to Emergency Department if ketones rise >= 3.0 mmol/L or emesis prevents oral intake.'
            ];
          } else {
            classificationCode = 'TIR_OPTIMAL';
            classificationTitle =
              'Well-Controlled Type 1 Diabetes (ADA Time-in-Range & Ketone Target Achieved)';
            urgency = 'ROUTINE_OPTIMIZATION';
            urgencyLabel = 'Stable Telemetry: Continue Current Closed-Loop Regimen';
            confidenceRationale =
              'Time-in-Range (70–180 mg/dL) is ' +
              analytics.timeInRangePercent +
              '% (ADA target > 70%), glycemic variability CV is ' +
              analytics.glucoseCvPercent +
              '% (< 36% target), and continuous interstitial ketones remain physiological (' +
              analytics.latestKetoneMmolL.toFixed(2) +
              ' mmol/L).';
            immediateProtocolSteps = [
              'Maintain current Automated Insulin Delivery (AID) basal profile and carbohydrate-to-insulin ratios.',
              'Continue pre-meal bolus timing 15 minutes prior to meals and exercise activity target 60 minutes prior to aerobic sessions.',
              'Routine outpatient endocrinology follow-up in 3–6 months; no acute ketosis or acid-base intervention needed.'
            ];
          }

          const stage1 = {
            stageNumber: 1,
            stageTitle: 'Stage 1: Telemetry Trend Extraction',
            promptGateIdentifier: 'GATE_01_MULTIMODAL_VECTOR_EXTRACTION',
            systemConstraintUsed:
              'Decouple glucose magnitude from ketone velocity; extract 24h CGM/CKM first-derivatives (dG/dt, dK/dt), nocturnal nadirs (00:00–06:00), and pharmacologic SGLT2i state.',
            extractedFindings: [
              'Latest Glucose: ' +
                analytics.latestGlucoseMgDl +
                ' mg/dL | 24h Mean: ' +
                analytics.meanGlucoseMgDl +
                ' mg/dL | TIR (70–180): ' +
                analytics.timeInRangePercent +
                '%',
              'Latest Interstitial BHB: ' +
                analytics.latestKetoneMmolL.toFixed(2) +
                ' mmol/L | Peak BHB: ' +
                analytics.peakKetoneMmolL.toFixed(2) +
                ' mmol/L | Max Velocity: +' +
                analytics.maxKetoneVelocityMmolHr.toFixed(2) +
                ' mmol/L/hr',
              'Nocturnal Nadir (00:00–06:00): ' +
                analytics.nocturnalNadirMgDl +
                ' mg/dL at 0' +
                analytics.nocturnalNadirHour +
                ':00 | Morning Peak (06:00–10:00): ' +
                analytics.morningPeakMgDl +
                ' mg/dL',
              'SGLT2 Inhibitor Exposure: ' +
                (effectiveContext.sglt2InhibitorActive
                  ? 'ACTIVE (' +
                    (effectiveContext.sglt2MedicationName || 'SGLT2i') +
                    ') — Renal glycosuria clamp present'
                  : 'INACTIVE')
            ],
            clinicalSynthesis:
              classificationCode === 'EUGLYCEMIC_DKA'
                ? 'Critical divergence detected: CGM shows deceptive near-normoglycemia (' +
                  analytics.latestGlucoseMgDl +
                  ' mg/dL) due to SGLT2i urinary glucose excretion, while CKM reveals exponential ketogenesis (+' +
                  analytics.sixHourKetoneDelta.toFixed(2) +
                  ' mmol/L over 6h to ' +
                  analytics.latestKetoneMmolL.toFixed(2) +
                  ' mmol/L).'
                : classificationCode === 'SOMOGYI_REBOUND'
                  ? 'Biphasic nocturnal-to-morning oscillation: severe overnight nadir (' +
                    analytics.nocturnalNadirMgDl +
                    ' mg/dL) precedes rapid morning rebound (' +
                    analytics.morningPeakMgDl +
                    ' mg/dL) with stable basal ketones.'
                  : classificationCode === 'HHS_HYPEROSMOLAR'
                    ? 'Monotonic hyperglycemic climb to ' +
                      analytics.latestGlucoseMgDl +
                      ' mg/dL with suppressed ketogenesis (peak ' +
                      analytics.peakKetoneMmolL.toFixed(2) +
                      ' mmol/L), indicating preserved basal insulin inhibition of lipolysis.'
                    : 'Stable dual-channel trajectory: TIR ' +
                      analytics.timeInRangePercent +
                      '% with physiological ketone homeostasis (' +
                      analytics.latestKetoneMmolL.toFixed(2) +
                      ' mmol/L) and low glycemic variability (CV ' +
                      analytics.glucoseCvPercent +
                      '%).',
            triggeredLogicGates: [
              analytics.latestKetoneMmolL >= 3.0
                ? 'CKM_CRITICAL_THRESHOLD (>= 3.0 mmol/L)'
                : analytics.latestKetoneMmolL >= 1.5
                  ? 'CKM_KETONEMIA_ALERT (1.5–2.9 mmol/L)'
                  : 'CKM_BASAL_HOMEOSTASIS (< 1.5 mmol/L)',
              effectiveContext.sglt2InhibitorActive
                ? 'SGLT2I_GLYCOSURIA_MASK_CHECK: ENABLED'
                : 'STANDARD_RENAL_THRESHOLD_MODEL',

            score += 12;

          if (analytics.anionGapMeqL > 16) score += 24;
          else if (analytics.anionGapMeqL > 12) score += 14;

          else if (analytics.effectiveOsmolalityMosmKg >= 305) score += 22;
          if (analytics.nocturnalNadirMgDl < 54) score += 36;
          else if (analytics.nocturnalNadirMgDl < 70) score += 24;
          score += Math.min(14, divergence.peakDivergenceIndex * 0.16);
          if (analytics.glucoseCvPercent > 36) score += 8;
          if (decision.classificationCode === 'TIR_OPTIMAL') {
            return Math.min(22, Math.max(8, Math.round(score * 0.45)));

          return Math.min(99, Math.max(10, Math.round(score)));

              if (ch === '·' || ch === '•') return '-';
              if (ch === '–' || ch === '—') return '-';
              if (ch === 'Δ') return 'Delta ';
              if (ch === 'β') return 'beta-';
              return ' ';
            });
        }

          words.forEach(function (word) {
            if (!current) current = word;
            else if (current.length + 1 + word.length <= maxChars) current += ' ' + word;
            else {
              lines.push(current);
              current = word;
            }
          });
          if (current) lines.push(current);
          return lines.length > 0 ? lines : [''];

                ') Tj ET'
            );
            const wrapped = wrapTextLines(value, 68);
            wrapped.forEach(function (line, idx) {
              const font = boldValue ? '/F2' : '/F1';
              ops.push(
                'BT ' +
                  font +
                  ' 9 Tf 0.06 0.09 0.16 rg 185 ' +
                  y +
                  ' Td (' +
                  escapePdfText(line) +
                  ') Tj ET'
              );
              if (idx < wrapped.length - 1) y -= 12;
            });
            y -= 14;
          }

          drawSectionHeader('1. PATIENT CLINICAL PROFILE & MEDICATION REGIMEN');
          drawKeyValueRow('Clinical Scenario Preset:', preset.title + ' (' + preset.id + ')', true);
          drawKeyValueRow('Diagnostic Risk Flag:', preset.clinicalTrapBadge, true);
          drawKeyValueRow(
            'Patient Demographics:',
            effectiveContext.age +
              '-year-old ' +
              (effectiveContext.sex === 'F' ? 'Female' : 'Male') +
              ' | Primary Dx: ' +
              effectiveContext.diagnosis
          );
          drawKeyValueRow('Active Medication Regimen:', effectiveContext.regimen);
          drawKeyValueRow('Clinical Presentation HPI:', effectiveContext.clinicalHistorySummary);

          drawSectionHeader('2. BIOCHEMICAL, ELECTROLYTE & ACID-BASE LABORATORY MATRIX');
          const labLines = [
            'Venous pH: ' +
              effectiveContext.venousPh.toFixed(2) +
              ' (Ref: 7.35-7.45)      |   Serum Bicarbonate (HCO3-): ' +
              effectiveContext.bicarbonateMeqL +
              ' mEq/L',
            'Anion Gap: ' +
              analytics.anionGapMeqL +
              ' mEq/L (Ref: 8-12 mEq/L)       |   Effective Osmolality: ' +
              analytics.effectiveOsmolalityMosmKg +
              ' mOsm/kg',
            'Measured Na+: ' +
              effectiveContext.sodiumMeqL +
              ' mEq/L                   |   Katz Corrected Na+: ' +
              analytics.correctedSodiumMeqL +
              ' mEq/L'
          ];
          labLines.forEach(function (row) {
            ops.push(
              'BT /F3 8.5 Tf 0.06 0.09 0.16 rg 44 ' +
                y +
                ' Td (' +
                escapePdfText(row) +
                ') Tj ET'
            );
            y -= 13;
          });

          drawSectionHeader('3. 24-HOUR DUAL-CHANNEL BIOSENSOR TELEMETRY & DIVERGENCE SUMMARY');
          drawKeyValueRow(
            'CGM Glycemic Summary:',
            'Latest: ' +
              analytics.latestGlucoseMgDl +
              ' mg/dL | 24h Mean: ' +
              analytics.meanGlucoseMgDl +
              ' mg/dL | TIR: ' +
              analytics.timeInRangePercent +
              '% | CV: ' +
              analytics.glucoseCvPercent +
              '%'
          );
          drawKeyValueRow(
            'CKM Ketone Kinetics:',
            'Latest BHB: ' +
              analytics.latestKetoneMmolL.toFixed(2) +
              ' mmol/L | Peak: ' +
              analytics.peakKetoneMmolL.toFixed(2) +
              ' mmol/L | Max Velocity: +' +
              analytics.maxKetoneVelocityMmolHr.toFixed(2) +
              ' mmol/L/hr'
          );
          drawKeyValueRow(
            'CGM-CKM Delta Divergence:',
            divergence.highRiskWindows.length > 0
              ? divergence.totalHighRiskHours +
                  ' High-Risk Hours | Peak Divergence Index: ' +
                  divergence.peakDivergenceIndex +
                  '/100'
              : '0 High-Risk Divergence Hours | Peak Divergence Index: ' +
                  divergence.peakDivergenceIndex +
                  '/100',
            true
          );

          drawSectionHeader('4. VALIDATED PHENOTYPE & ADA / ISPAD CLINICAL MANAGEMENT PLAN');
          drawKeyValueRow('Primary Phenotype:', decision.classificationTitle, true);
          drawKeyValueRow('Triage Disposition:', decision.urgencyLabel, true);

          const contentStream = ops.join('\n');
          const streamBytesLength = new TextEncoder().encode(contentStream).length;
          const objects = [
            '1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n',
            '2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n',
            '3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R /F2 5 0 R /F3 6 0 R >> >> /Contents 7 0 R >>\nendobj\n',
            '4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n',
            '5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>\nendobj\n',
            '6 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>\nendobj\n',
            '7 0 obj\n<< /Length ' +
              streamBytesLength +
              ' >>\nstream\n' +
              contentStream +
              '\nendstream\nendobj\n'
          ];

          let pdf = '%PDF-1.4\n';
          const offsets = [0];
          objects.forEach(function (obj) {
            offsets.push(new TextEncoder().encode(pdf).length);
            pdf += obj;
          });
          const xrefOffset = new TextEncoder().encode(pdf).length;
          pdf += 'xref\n0 ' + (objects.length + 1) + '\n';
          pdf += '0000000000 65535 f \n';
          for (let i = 1; i <= objects.length; i++) {
            pdf += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
          }
          pdf +=
            'trailer\n<< /Size ' +
            (objects.length + 1) +
            ' /Root 1 0 R >>\nstartxref\n' +
            xrefOffset +
            '\n%%EOF\n';

          return new TextEncoder().encode(pdf);
        }

        function createSnapshotFromPreset(preset, overrides, timestampLabel, idSuffix) {
          const decision = evaluateClinicalReasoningPipeline(preset, overrides);
          const effectiveSeries = preset.series.map(function (pt, idx) {
            if (idx === preset.series.length - 1) {
              return Object.assign({}, pt, {
                glucoseMgDl:
                  overrides.overrideLatestGlucoseMgDl !== undefined
                    ? overrides.overrideLatestGlucoseMgDl
                    : pt.glucoseMgDl,
                ketoneMmolL:
                  overrides.overrideLatestKetoneMmolL !== undefined
                    ? overrides.overrideLatestKetoneMmolL
                    : pt.ketoneMmolL
              });
            }
            return pt;
          });
          const divergence = computeCgmCkmDivergence(effectiveSeries);
          const urgencyScore = computeClinicalUrgencyScore(decision, divergence);

          return {
            id: preset.id + '-' + idSuffix,
            timestampLabel: timestampLabel,
            presetId: preset.id,
            presetShortName: preset.shortName,
            presetTitle: preset.title,
            overrides: Object.assign({}, overrides),
            overrideSummaryText: formatOverrideSummary(preset, overrides),
            latestGlucoseMgDl: decision.analytics.latestGlucoseMgDl,
            latestKetoneMmolL: decision.analytics.latestKetoneMmolL,
            bicarbonateMeqL:
              overrides.overrideBicarbonateMeqL !== undefined
                ? overrides.overrideBicarbonateMeqL
                : preset.patientContext.bicarbonateMeqL,
            sglt2InhibitorActive:
              overrides.sglt2InhibitorActive !== undefined
                ? overrides.sglt2InhibitorActive
                : preset.patientContext.sglt2InhibitorActive,
            glucoseCvPercent: decision.analytics.glucoseCvPercent,
            peakDivergenceIndex: divergence.peakDivergenceIndex,
            classificationCode: decision.classificationCode,
            classificationTitle: decision.classificationTitle,
            urgency: decision.urgency,
            urgencyScore: urgencyScore
          };
        }

        // ============================================================================
        // 3. APPLICATION STATE & REACTIVE RENDERER
        // ============================================================================
        const state = {
          selectedPresetId: 'euglycemic-dka',
          selectedHour: 24,
          hoveredHour: null,
          overrides: {},
          showDeltaDivergenceOverlay: true,
          expandedGates: true,
          isRunningLlm: false,
          llmAudit: null,
          exportConfirmation: false,
          pdfProfileConfirmation: false,
          copiedEhr: false,
          copiedSms: false,
          dispatchedSms: false,
          simulationHistory: [
            createSnapshotFromPreset(TELEMETRY_PRESETS[0], {}, 'Baseline #1', 'seed-1'),
            createSnapshotFromPreset(TELEMETRY_PRESETS[1], {}, 'Baseline #2', 'seed-2'),
            createSnapshotFromPreset(TELEMETRY_PRESETS[3], {}, 'Baseline #3', 'seed-3')
          ]
        };

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function getActivePreset() {
          return (
            TELEMETRY_PRESETS.find(function (p) {
              return p.id === state.selectedPresetId;
            }) || TELEMETRY_PRESETS[0]
          );
        }

        function getEffectiveSeries(activePreset) {
          return activePreset.series.map(function (pt, idx) {
            if (idx === activePreset.series.length - 1) {
              return Object.assign({}, pt, {
                glucoseMgDl:
                  state.overrides.overrideLatestGlucoseMgDl !== undefined
                    ? state.overrides.overrideLatestGlucoseMgDl
                    : pt.glucoseMgDl,
                ketoneMmolL:
                  state.overrides.overrideLatestKetoneMmolL !== undefined
                    ? state.overrides.overrideLatestKetoneMmolL
                    : pt.ketoneMmolL
              });
            }
            return pt;
          });
        }

        function drawTelemetryCanvas(effectiveSeries, divergenceSummary, maxGlucoseBound) {
          const canvas = document.querySelector('[data-testid="telemetry-canvas"]');
          const container = document.getElementById('telemetry-canvas-container');
          if (!canvas || !container) return;

          const rect = container.getBoundingClientRect();
          const W = Math.max(320, Math.floor(rect.width || 820));
          const H = W < 600 ? 310 : 375;
          const dpr = window.devicePixelRatio || 1;
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          canvas.style.height = H + 'px';

          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          ctx.scale(dpr, dpr);

          const maxKetoneBound = 5.0;
          const padLeft = 58;
          const padRight = 58;
          const padTop = 30;
          const padBottom = 42;
          const plotW = W - padLeft - padRight;
          const plotH = H - padTop - padBottom;

          function xForHour(hr) {
            return padLeft + (hr / 24) * plotW;
          }
          function yForGlucose(g) {
            return (
              padTop +
              plotH -
              (Math.min(maxGlucoseBound, Math.max(0, g)) / maxGlucoseBound) * plotH
            );
          }
          function yForKetone(k) {
            return (
              padTop +
              plotH -
              (Math.min(maxKetoneBound, Math.max(0, k)) / maxKetoneBound) * plotH
            );
          }

          ctx.clearRect(0, 0, W, H);
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, W, H);

          // 1. Shaded TIR Band (70-180 mg/dL)
          const yTirTop = yForGlucose(180);
          const yTirBottom = yForGlucose(70);
          ctx.fillStyle = 'rgba(16, 185, 129, 0.06)';
          ctx.fillRect(padLeft, yTirTop, plotW, yTirBottom - yTirTop);

          ctx.strokeStyle = 'rgba(16, 185, 129, 0.25)';
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(padLeft, yTirTop);
          ctx.lineTo(padLeft + plotW, yTirTop);
          ctx.moveTo(padLeft, yTirBottom);
          ctx.lineTo(padLeft + plotW, yTirBottom);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = '#047857';
          ctx.font = '600 10px "IBM Plex Mono", monospace';
          ctx.textAlign = 'left';
          ctx.fillText('TARGET TIR: 70–180 mg/dL', padLeft + 8, yTirTop + 13);

          // 2. Horizontal Grid & Left Axis
          const glucoseSteps = 5;
          ctx.font = '400 11px "IBM Plex Mono", monospace';
          for (let i = 0; i <= glucoseSteps; i++) {
            const gVal = Math.round((maxGlucoseBound / glucoseSteps) * i);
            const y = yForGlucose(gVal);
            ctx.strokeStyle = '#E2E8F0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padLeft, y);
            ctx.lineTo(padLeft + plotW, y);
            ctx.stroke();

            ctx.fillStyle = '#0369A1';
            ctx.textAlign = 'right';
            ctx.fillText(String(gVal), padLeft - 8, y + 4);
          }

          // Right Axis labels
          [0, 1.0, 1.5, 3.0, 4.0, 5.0].forEach(function (kVal) {
            const y = yForKetone(kVal);
            ctx.fillStyle = kVal >= 3.0 ? '#BE123C' : kVal >= 1.5 ? '#B45309' : '#64748B';
            ctx.textAlign = 'left';
            ctx.fillText(kVal.toFixed(1), padLeft + plotW + 8, y + 4);
          });

          // 3. Vertical Hour Grid
          ctx.font = '400 11px "IBM Plex Mono", monospace';
          ctx.textAlign = 'center';
          for (let hr = 0; hr <= 24; hr += 3) {
            const x = xForHour(hr);
            ctx.strokeStyle = '#F1F5F9';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, padTop);
            ctx.lineTo(x, padTop + plotH);
            ctx.stroke();

            ctx.fillStyle = '#475569';
            ctx.fillText(String(hr).padStart(2, '0') + ':00', x, padTop + plotH + 20);
          }

          // 4. High-Risk CGM-CKM Delta Divergence Overlay
          if (state.showDeltaDivergenceOverlay && divergenceSummary.highRiskWindows.length > 0) {
            divergenceSummary.highRiskWindows.forEach(function (win) {
              const xStart = xForHour(win.startHour);
              const xEnd = xForHour(win.endHour);
              const spanW = Math.max(6, xEnd - xStart);

              ctx.fillStyle = 'rgba(225, 29, 72, 0.055)';
              ctx.fillRect(xStart, padTop, spanW, plotH);

              ctx.fillStyle = 'rgba(190, 18, 60, 0.9)';
              ctx.fillRect(xStart, padTop, spanW, 3);

              const winPoints = effectiveSeries.filter(function (p) {
                return p.hour >= win.startHour && p.hour <= win.endHour;
              });
              if (winPoints.length >= 2) {
                ctx.beginPath();
                winPoints.forEach(function (pt, idx) {
                  const x = xForHour(pt.hour);
                  const yG = yForGlucose(pt.glucoseMgDl);
                  if (idx === 0) ctx.moveTo(x, yG);
                  else ctx.lineTo(x, yG);
                });
                for (let idx = winPoints.length - 1; idx >= 0; idx--) {
                  const pt = winPoints[idx];
                  ctx.lineTo(xForHour(pt.hour), yForKetone(pt.ketoneMmolL));
                }
                ctx.closePath();
                ctx.fillStyle = 'rgba(244, 63, 94, 0.14)';
                ctx.fill();
              }

              winPoints.forEach(function (pt) {
                const x = xForHour(pt.hour);
                ctx.strokeStyle = 'rgba(225, 29, 72, 0.45)';
                ctx.lineWidth = 1.25;
                ctx.setLineDash([2, 2]);
                ctx.beginPath();
                ctx.moveTo(x, yForGlucose(pt.glucoseMgDl));
                ctx.lineTo(x, yForKetone(pt.ketoneMmolL));
                ctx.stroke();
                ctx.setLineDash([]);
              });

              const badgeText = 'Δ DIVERGENCE ZONE (' + win.startLabel + '–' + win.endLabel + ')';
              ctx.font = '600 9.5px "IBM Plex Mono", monospace';
              const bw = ctx.measureText(badgeText).width + 10;
              const bx = Math.min(
                padLeft + plotW - bw - 4,
                Math.max(padLeft + 4, xStart + 4)
              );
              ctx.fillStyle = 'rgba(255, 241, 242, 0.95)';
              ctx.strokeStyle = 'rgba(225, 29, 72, 0.45)';
              ctx.lineWidth = 1;
              ctx.fillRect(bx, padTop + 6, bw, 15);
              ctx.strokeRect(bx, padTop + 6, bw, 15);
              ctx.fillStyle = '#9F1239';
              ctx.textAlign = 'left';
              ctx.fillText(badgeText, bx + 5, padTop + 16.5);
            });
          }

          // 5. DKA Threshold 3.0 mmol/L Line
          const yDkaThreshold = yForKetone(3.0);
          ctx.strokeStyle = 'rgba(225, 29, 72, 0.55)';
          ctx.lineWidth = 1.25;
          ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.moveTo(padLeft, yDkaThreshold);
          ctx.lineTo(padLeft + plotW, yDkaThreshold);
          ctx.stroke();
          ctx.setLineDash([]);

          const dkaLabelText = 'DKA THRESHOLD: 3.0 mmol/L BHB';
          ctx.font = '600 10px "IBM Plex Mono", monospace';
          const dkaTextWidth = ctx.measureText(dkaLabelText).width;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
          ctx.fillRect(padLeft + 6, yDkaThreshold - 15, dkaTextWidth + 8, 13);
          ctx.fillStyle = '#BE123C';
          ctx.textAlign = 'left';
          ctx.fillText(dkaLabelText, padLeft + 10, yDkaThreshold - 5);

          // 6. Ketone 1.5 mmol/L Warning Line
          const yKetoneWarn = yForKetone(1.5);
          ctx.strokeStyle = 'rgba(217, 119, 6, 0.4)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(padLeft, yKetoneWarn);
          ctx.lineTo(padLeft + plotW, yKetoneWarn);
          ctx.stroke();
          ctx.setLineDash([]);

          // 7. Glucose Curve
          ctx.beginPath();
          effectiveSeries.forEach(function (pt, i) {
            const x = xForHour(pt.hour);
            const y = yForGlucose(pt.glucoseMgDl);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.strokeStyle = '#0284C7';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          const gradG = ctx.createLinearGradient(0, padTop, 0, padTop + plotH);
          gradG.addColorStop(0, 'rgba(2, 132, 199, 0.12)');
          gradG.addColorStop(1, 'rgba(2, 132, 199, 0.0)');
          ctx.lineTo(xForHour(24), padTop + plotH);
          ctx.lineTo(xForHour(0), padTop + plotH);
          ctx.closePath();
          ctx.fillStyle = gradG;
          ctx.fill();

          // 8. Ketone Curve
          ctx.beginPath();
          effectiveSeries.forEach(function (pt, i) {
            const x = xForHour(pt.hour);
            const y = yForKetone(pt.ketoneMmolL);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          const peakK = Math.max.apply(
            null,
            effectiveSeries.map(function (d) {
              return d.ketoneMmolL;
            })
          );
          ctx.strokeStyle = peakK >= 3.0 ? '#E11D48' : '#D97706';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          // 9. Data Nodes
          effectiveSeries.forEach(function (pt) {
            const x = xForHour(pt.hour);
            const yG = yForGlucose(pt.glucoseMgDl);
            const yK = yForKetone(pt.ketoneMmolL);

            ctx.fillStyle = pt.glucoseMgDl < 70 ? '#DC2626' : '#0284C7';
            ctx.beginPath();
            ctx.arc(x, yG, pt.eventAnnotation ? 4.5 : 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle =
              pt.ketoneMmolL >= 3.0
                ? '#E11D48'
                : pt.ketoneMmolL >= 1.5
                  ? '#D97706'
                  : '#F59E0B';
            ctx.beginPath();
            ctx.arc(x, yK, pt.eventAnnotation ? 4.5 : 3, 0, Math.PI * 2);
            ctx.fill();
          });

          // 10. Active Crosshair Probe
          const activeHr =
            state.hoveredHour !== null ? state.hoveredHour : state.selectedHour;
          const activePt =
            effectiveSeries.find(function (p) {
              return p.hour === activeHr;
            }) || effectiveSeries[effectiveSeries.length - 1];

          if (activePt) {
            const cx = xForHour(activePt.hour);
            const cyG = yForGlucose(activePt.glucoseMgDl);
            const cyK = yForKetone(activePt.ketoneMmolL);

            ctx.strokeStyle = '#0F172A';
            ctx.lineWidth = 1;
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(cx, padTop);
            ctx.lineTo(cx, padTop + plotH);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = '#0284C7';
            ctx.lineWidth = 2;
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(cx, cyG, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = activePt.ketoneMmolL >= 3.0 ? '#E11D48' : '#D97706';
            ctx.lineWidth = 2;
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(cx, cyK, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }

          ctx.fillStyle = '#0369A1';
          ctx.font = '600 10px "IBM Plex Mono", monospace';
          ctx.textAlign = 'left';
          ctx.fillText('CGM GLUCOSE (mg/dL)', 10, 16);

          ctx.fillStyle = peakK >= 3.0 ? '#BE123C' : '#B45309';
          ctx.textAlign = 'right';
          ctx.fillText('CKM KETONES (mmol/L)', W - 10, 16);
        }

        function renderApp() {
          const activePreset = getActivePreset();
          const decision = evaluateClinicalReasoningPipeline(
            activePreset,
            state.overrides
          );
          const effectiveSeries = getEffectiveSeries(activePreset);
          const maxGlucoseBound = Math.max(
            300,
            Math.ceil(
              Math.max.apply(
                null,
                effectiveSeries.map(function (d) {
                  return d.glucoseMgDl;
                })
              ) / 100
            ) *
              100 +
              50
          );
          const divergenceSummary = computeCgmCkmDivergence(
            effectiveSeries,
            maxGlucoseBound
          );
          const gvTrend = computeGlycemicVariabilityTrend(effectiveSeries);
          const currentUrgencyScore = computeClinicalUrgencyScore(
            decision,
            divergenceSummary
          );

          const effectiveSglt2 =
            state.overrides.sglt2InhibitorActive !== undefined
              ? state.overrides.sglt2InhibitorActive
              : activePreset.patientContext.sglt2InhibitorActive;
          const effectiveGlucose =
            state.overrides.overrideLatestGlucoseMgDl !== undefined
              ? state.overrides.overrideLatestGlucoseMgDl
              : decision.analytics.latestGlucoseMgDl;
          const effectiveKetone =
            state.overrides.overrideLatestKetoneMmolL !== undefined
              ? state.overrides.overrideLatestKetoneMmolL
              : decision.analytics.latestKetoneMmolL;
          const effectiveBicarb =
            state.overrides.overrideBicarbonateMeqL !== undefined
              ? state.overrides.overrideBicarbonateMeqL
              : activePreset.patientContext.bicarbonateMeqL;
          const effectivePh =
            state.overrides.overrideVenousPh !== undefined
              ? state.overrides.overrideVenousPh
              : activePreset.patientContext.venousPh;

          const urgencyBannerTone =
            decision.urgency === 'CRITICAL_ED_NOW'
              ? 'bg-rose-50 border-rose-300 text-rose-950'
              : decision.urgency === 'URGENT_CLINICAL_ACTION'
                ? 'bg-amber-50 border-amber-300 text-amber-950'
                : 'bg-emerald-50 border-emerald-300 text-emerald-950';

          const urgencyGlyph =
            decision.urgency === 'CRITICAL_ED_NOW'
              ? '✖ CRITICAL EMERGENCY'
              : decision.urgency === 'URGENT_CLINICAL_ACTION'
                ? '▲ URGENT ACTION'
                : '● NOMINAL HOMEOSTASIS';

          const inspectedHour =
            state.hoveredHour !== null ? state.hoveredHour : state.selectedHour;
          const inspectedPoint =
            effectiveSeries.find(function (p) {
              return p.hour === inspectedHour;
            }) || effectiveSeries[effectiveSeries.length - 1];
          const inspectedDivergence =
            divergenceSummary.points.find(function (p) {
              return p.hour === inspectedHour;
            }) || divergenceSummary.points[divergenceSummary.points.length - 1];

          const gaugeRatio = Math.min(
            100,
            Math.round((gvTrend.overallCvPercent / 60) * 100)
          );
          const thresholdMarkerPercent = Math.round((36 / 60) * 100);

          const root = document.getElementById('root');
          if (!root) return;

          root.innerHTML = `

          // Preset selector buttons
          document.querySelectorAll('.preset-select-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const id = btn.getAttribute('data-preset-id');
              if (!id) return;
              const nextPreset =
                TELEMETRY_PRESETS.find(function (p) {
                  return p.id === id;
                }) || TELEMETRY_PRESETS[0];
              state.selectedPresetId = id;
              state.selectedHour = 24;
              state.hoveredHour = null;
              state.overrides = {};
              captureSnapshot(nextPreset, {});
              renderApp();
            });
          });

          // Risk Zone Hour buttons
          document.querySelectorAll('.risk-zone-hour-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const hr = Number(btn.getAttribute('data-risk-hour'));
              if (!isNaN(hr)) {
                state.selectedHour = hr;
                state.hoveredHour = null;
                renderApp();
              }
            });
          });

          // GV Quadrant buttons
          document.querySelectorAll('.gv-quadrant-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const hr = Number(btn.getAttribute('data-quad-hour'));
              if (!isNaN(hr)) {
                state.selectedHour = hr;
                state.hoveredHour = null;
                renderApp();
              }
            });
          });

          // Capture What-If Snapshot
          const captureBtn = document.getElementById('btn-capture-snapshot');
          if (captureBtn) {
            captureBtn.addEventListener('click', function () {
              captureSnapshot(activePreset, state.overrides);
              renderApp();
            });
          }

          // Clear History Buffer
          const clearHistBtn = document.getElementById('btn-clear-history');
          if (clearHistBtn) {
            clearHistBtn.addEventListener('click', function () {
              state.simulationHistory = [
                createSnapshotFromPreset(
                  activePreset,
                  state.overrides,
                  'Current State',
                  'reset-' + Date.now()
                )
              ];
              renderApp();
            });
          }

          // Restore Snapshot buttons
          document.querySelectorAll('.restore-snapshot-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const idx = Number(btn.getAttribute('data-snapshot-idx'));
              const snap = state.simulationHistory[idx];
              if (snap) {
                state.selectedPresetId = snap.presetId;
                state.overrides = Object.assign({}, snap.overrides);
                state.selectedHour = 24;
                state.hoveredHour = null;
                renderApp();
              }
            });
          });

          // Toggle Delta Divergence Overlay
          const toggleDeltaBtn = document.getElementById('btn-toggle-delta-overlay');
          if (toggleDeltaBtn) {
            toggleDeltaBtn.addEventListener('click', function () {
              state.showDeltaDivergenceOverlay = !state.showDeltaDivergenceOverlay;
              renderApp();
            });
          }

          // Parameter Sliders & Checkboxes
          const sglt2Checkbox = document.getElementById('toggle-sglt2i');
          if (sglt2Checkbox) {
            sglt2Checkbox.addEventListener('change', function (e) {
              state.overrides.sglt2InhibitorActive = Boolean(e.target.checked);
              renderApp();
            });
          }

          const glucoseSlider = document.getElementById('slider-glucose');
          if (glucoseSlider) {
            glucoseSlider.addEventListener('input', function (e) {
              state.overrides.overrideLatestGlucoseMgDl = Number(e.target.value);
              renderApp();
            });
          }

          const ketoneSlider = document.getElementById('slider-ketone');
          if (ketoneSlider) {
            ketoneSlider.addEventListener('input', function (e) {
              state.overrides.overrideLatestKetoneMmolL = Number(e.target.value);
              renderApp();
            });
          }

          const bicarbSlider = document.getElementById('slider-bicarb');
          if (bicarbSlider) {
            bicarbSlider.addEventListener('input', function (e) {
              state.overrides.overrideBicarbonateMeqL = Number(e.target.value);
              renderApp();
            });
          }

          const resetOverridesBtn = document.getElementById('btn-reset-overrides');
          if (resetOverridesBtn) {
            resetOverridesBtn.addEventListener('click', function () {
              state.overrides = {};
              state.selectedHour = 24;
              state.hoveredHour = null;
              renderApp();
            });
          }

          const hourScrubber = document.getElementById('telemetry-hour-scrubber');
          if (hourScrubber) {
            hourScrubber.addEventListener('input', function (e) {
              state.selectedHour = Number(e.target.value);
              state.hoveredHour = null;
              renderApp();
            });
          }

          // Canvas hover & click
          const canvas = document.querySelector('[data-testid="telemetry-canvas"]');
          if (canvas) {
            canvas.addEventListener('mousemove', function (e) {
              const rect = canvas.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const padLeft = 58;
              const padRight = 58;
              const plotW = Math.max(200, rect.width - padLeft - padRight);
              const ratio = Math.max(0, Math.min(1, (x - padLeft) / plotW));
              const hr = Math.round(ratio * 24);
              if (state.hoveredHour !== hr) {
                state.hoveredHour = hr;
                renderApp();
              }
            });
            canvas.addEventListener('mouseleave', function () {
              if (state.hoveredHour !== null) {
                state.hoveredHour = null;
                renderApp();
              }
            });
            canvas.addEventListener('click', function () {
              if (state.hoveredHour !== null) {
                state.selectedHour = state.hoveredHour;
                renderApp();
              }
            });
          }

          // Download Profile PDF
          const pdfBtn = document.getElementById('btn-download-profile-pdf');
          if (pdfBtn) {
            pdfBtn.addEventListener('click', function () {
              const effectiveContext = Object.assign({}, activePreset.patientContext, {
                sglt2InhibitorActive:
                  state.overrides.sglt2InhibitorActive !== undefined
                    ? state.overrides.sglt2InhibitorActive
                    : activePreset.patientContext.sglt2InhibitorActive,
                bicarbonateMeqL:
                  state.overrides.overrideBicarbonateMeqL !== undefined
                    ? state.overrides.overrideBicarbonateMeqL
                    : activePreset.patientContext.bicarbonateMeqL,
                venousPh:
                  state.overrides.overrideVenousPh !== undefined
                    ? state.overrides.overrideVenousPh
                    : activePreset.patientContext.venousPh,
                sodiumMeqL:
                  state.overrides.overrideSodiumMeqL !== undefined
                    ? state.overrides.overrideSodiumMeqL
                    : activePreset.patientContext.sodiumMeqL
              });
              const pdfBytes = buildPatientClinicalProfilePdfBytes({
                preset: activePreset,
                effectiveContext: effectiveContext,
                decision: decision,
                divergence: divergenceSummary
              });
              const blob = new Blob([pdfBytes.buffer], { type: 'application/pdf' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'Patient_Clinical_Profile_' + activePreset.id + '_Note.pdf';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              state.pdfProfileConfirmation = true;
              renderApp();
              setTimeout(function () {
                state.pdfProfileConfirmation = false;
                renderApp();
              }, 2500);
            });
          }

          // Export EHR Triage Report
          const exportBtn = document.getElementById('btn-export-report');
          if (exportBtn) {
            exportBtn.addEventListener('click', function () {
              const blob = new Blob([decision.ehrSmartPhrase], {
                type: 'text/plain;charset=utf-8'
              });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'GlucoKetone_AI_' + activePreset.id + '_EHR_SmartPhrase.txt';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              state.exportConfirmation = true;
              renderApp();
              setTimeout(function () {
                state.exportConfirmation = false;
                renderApp();
              }, 2500);
            });
          }

          // Toggle System Gates
          const toggleGatesBtn = document.getElementById('btn-toggle-gates');
          if (toggleGatesBtn) {
            toggleGatesBtn.addEventListener('click', function () {
              state.expandedGates = !state.expandedGates;
              renderApp();
            });
          }

          // Execute 3-Stage Prompt Chain (works both with backend /api/clinical/reason and static GitHub Pages)
          const runChainBtn = document.getElementById('btn-run-chain');
          if (runChainBtn) {
            runChainBtn.addEventListener('click', function () {
              state.isRunningLlm = true;
              renderApp();

              const buildClientFallback = function () {
                return {
                  mode: 'deterministic_verified',
                  modelUsed: 'gemini-3.8-flash (Constraint-Guided Clinical Engine)',
                  stage1Summary:
                    'Extracted 24h CGM/CKM trajectory for ' +
                    activePreset.title +
                    ': Latest Glucose ' +
                    decision.analytics.latestGlucoseMgDl +
                    ' mg/dL (TIR ' +
                    decision.analytics.timeInRangePercent +
                    '%), Latest Interstitial BHB ' +
                    decision.analytics.latestKetoneMmolL.toFixed(2) +
                    ' mmol/L (+' +
                    decision.analytics.maxKetoneVelocityMmolHr.toFixed(2) +
                    ' mmol/L/hr peak velocity).',
                  stage2Summary:
                    'Acid-Base & Osmolar Matrix: Venous pH ' +
                    activePreset.patientContext.venousPh.toFixed(2) +
                    ', HCO3- ' +
                    activePreset.patientContext.bicarbonateMeqL +
                    ' mEq/L, Anion Gap ' +
                    decision.analytics.anionGapMeqL +
                    ' mEq/L, Effective Osmolality ' +
                    decision.analytics.effectiveOsmolalityMosmKg +
                    ' mOsm/kg.',
                  stage3Action: decision.immediateProtocolSteps[0],
                  euDkaTrapAnalysis: decision.confidenceRationale,
                  timestamp: new Date().toISOString()
                };
              };

              fetch('./api/clinical/reason', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  presetId: activePreset.id,
                  presetTitle: activePreset.title,
                  patientContext: activePreset.patientContext,
                  analytics: decision.analytics,
                  classificationCode: decision.classificationCode,
                  classificationTitle: decision.classificationTitle
                })
              })
                .then(function (res) {
                  if (!res.ok) throw new Error('Static fallback');
                  return res.json();
                })
                .then(function (data) {
                  state.llmAudit = data;
                  state.isRunningLlm = false;
                  renderApp();
                })
                .catch(function () {
                  state.llmAudit = buildClientFallback();
                  state.isRunningLlm = false;
                  renderApp();
                });
            });
          }

          // Copy EHR SmartPhrase
          const copyEhrBtn = document.getElementById('btn-copy-ehr');
          if (copyEhrBtn) {
            copyEhrBtn.addEventListener('click', function () {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(decision.ehrSmartPhrase).catch(function () {});
              }
              state.copiedEhr = true;
              renderApp();
              setTimeout(function () {
                state.copiedEhr = false;
                renderApp();
              }, 2000);
            });
          }

          // Copy Patient SMS
          const copySmsBtn = document.getElementById('btn-copy-sms');
          if (copySmsBtn) {
            copySmsBtn.addEventListener('click', function () {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(decision.patientSmsAlert).catch(function () {});
              }
              state.copiedSms = true;
              renderApp();
              setTimeout(function () {
                state.copiedSms = false;
                renderApp();
              }, 2000);
            });
          }

          // Simulate SMS Dispatch
          const simSmsBtn = document.getElementById('btn-simulate-sms-dispatch');
          if (simSmsBtn) {
            simSmsBtn.addEventListener('click', function () {
              state.dispatchedSms = true;
              renderApp();
              setTimeout(function () {
                state.dispatchedSms = false;
                renderApp();
              }, 3500);
            });
          }
        }

        window.addEventListener('resize', function () {
          const activePreset = getActivePreset();
          const effectiveSeries = getEffectiveSeries(activePreset);
          const maxGlucoseBound = Math.max(
            300,
            Math.ceil(
              Math.max.apply(
                null,
                effectiveSeries.map(function (d) {
                  return d.glucoseMgDl;
                })
              ) / 100
            ) *
              100 +
              50
          );
          const divergenceSummary = computeCgmCkmDivergence(
            effectiveSeries,
            maxGlucoseBound
          );
          drawTelemetryCanvas(effectiveSeries, divergenceSummary, maxGlucoseBound);
        });

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', renderApp);
        } else {
          renderApp();
        }
      })();
    </script>
  </body>
</html>
